name: Publish Liubai MCP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mcp-release.yml"
      - "liubai-frontends/liubai-mcp/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liubai-mcp-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            asset: liubai-mcp-linux-x64
          - target: bun-linux-arm64
            asset: liubai-mcp-linux-arm64
          - target: bun-linux-x64-baseline-musl
            asset: liubai-mcp-linux-x64-musl
          - target: bun-linux-arm64-musl
            asset: liubai-mcp-linux-arm64-musl
          - target: bun-darwin-x64
            asset: liubai-mcp-darwin-x64
          - target: bun-darwin-arm64
            asset: liubai-mcp-darwin-arm64
          - target: bun-windows-x64-baseline
            asset: liubai-mcp-windows-x64.exe
          - target: bun-windows-arm64
            asset: liubai-mcp-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone executable
        working-directory: liubai-frontends/liubai-mcp
        run: >-
          bun build --compile --target=${{ matrix.target }}
          src/index.ts --outfile=release/${{ matrix.asset }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: liubai-frontends/liubai-mcp/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve release version
        id: version
        run: |
          package_version="$(jq -r .version liubai-frontends/liubai-mcp/package.json)"
          short_sha="${GITHUB_SHA::7}"
          echo "name=${package_version}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=liubai-mcp-v${package_version}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Liubai MCP ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release/*
